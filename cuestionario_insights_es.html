<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario Insights — Conócete mejor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rouge: #D85A30;
    --rouge-light: #FAECE7;
    --rouge-dark: #993C1D;
    --jaune: #BA7517;
    --jaune-light: #FAEEDA;
    --jaune-dark: #854F0B;
    --vert: #3B6D11;
    --vert-light: #EAF3DE;
    --vert-dark: #27500A;
    --bleu: #185FA5;
    --bleu-light: #E6F1FB;
    --bleu-dark: #0C447C;
    --purple: #533AB7;
    --purple-light: #EEEDFE;
    --bg: #F8F7FF;
    --surface: #FFFFFF;
    --text: #1A1A2E;
    --text-muted: #6B6B8A;
    --border: rgba(83,58,183,0.15);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem 3rem;
  }

  .header {
    text-align: center;
    margin-bottom: 2rem;
    max-width: 560px;
    width: 100%;
  }

  .header-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--purple);
    background: var(--purple-light);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 0.75rem;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.4rem;
    line-height: 1.3;
  }

  .header p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 1.75rem 1.5rem;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 2px 20px rgba(83,58,183,0.07);
  }

  .progress-wrap { margin-bottom: 1.5rem; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .progress-track {
    height: 5px;
    background: var(--purple-light);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 5px;
    background: var(--purple);
    border-radius: 3px;
    transition: width 0.35s ease;
  }

  .q-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 1.25rem;
    line-height: 1.5;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 1.5rem;
  }

  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: background 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .opt-btn:hover { background: var(--bg); }

  .opt-btn.selected {
    border-color: var(--purple);
    background: var(--purple-light);
  }

  .opt-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--purple);
    transition: background 0.15s, border-color 0.15s;
  }

  .opt-btn.selected .opt-letter {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
  }

  .opt-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.45;
    padding-top: 3px;
  }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .btn-secondary {
    padding: 10px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-muted);
    transition: background 0.15s;
  }

  .btn-secondary:hover { background: var(--bg); }
  .btn-secondary:disabled { opacity: 0.35; cursor: default; }

  .btn-primary {
    flex: 1;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--purple);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: white;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.35; cursor: default; }

  .results-header { margin-bottom: 1.5rem; }
  .result-badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; margin-bottom: 0.75rem; }
  .result-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
  .result-sub { font-size: 13px; color: var(--text-muted); }

  .scores-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .score-card {
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid transparent;
  }

  .score-card.dominant { border-width: 2px; }
  .score-num { font-size: 26px; font-weight: 700; }
  .score-lbl { font-size: 11px; font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

  .rouge-card { background: var(--rouge-light); border-color: var(--rouge); }
  .rouge-card .score-num { color: var(--rouge-dark); }
  .rouge-card .score-lbl { color: var(--rouge); }
  .jaune-card { background: var(--jaune-light); border-color: var(--jaune); }
  .jaune-card .score-num { color: var(--jaune-dark); }
  .jaune-card .score-lbl { color: var(--jaune); }
  .vert-card { background: var(--vert-light); border-color: var(--vert); }
  .vert-card .score-num { color: var(--vert-dark); }
  .vert-card .score-lbl { color: var(--vert); }
  .bleu-card { background: var(--bleu-light); border-color: var(--bleu); }
  .bleu-card .score-num { color: var(--bleu-dark); }
  .bleu-card .score-lbl { color: var(--bleu); }

  .bars-section { margin-bottom: 1.25rem; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-lbl { font-size: 13px; font-weight: 500; width: 44px; }
  .bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 8px; border-radius: 4px; transition: width 0.5s ease; }
  .bar-val { font-size: 12px; color: var(--text-muted); min-width: 18px; text-align: right; }

  .info-box {
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 1rem 1.1rem;
    margin-bottom: 10px;
  }

  .info-box h3 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .info-box p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

  .restart-btn {
    margin-top: 1rem;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
    transition: background 0.15s;
  }

  .restart-btn:hover { background: var(--bg); }

  .tcp-footer {
    margin-top: 2rem;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    opacity: 0.7;
  }

  @media (max-width: 400px) {
    .card { padding: 1.25rem 1rem; }
    .scores-grid { gap: 6px; }
    .score-num { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">TCP Consulting</div>
  <h1>Conócete mejor</h1>
  <p>Cuestionario Insights — identifica tu estilo de liderazgo en 25 preguntas</p>
</div>

<div class="card" id="quiz-card">
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="q-counter">Pregunta 1 / 25</span>
      <span id="q-pct">4%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:4%"></div>
    </div>
  </div>
  <div class="q-text" id="q-text"></div>
  <div class="options-list" id="options-list"></div>
  <div class="nav-row">
    <button class="btn-secondary" id="btn-prev" onclick="prevQ()" disabled>← Anterior</button>
    <button class="btn-primary" id="btn-next" onclick="nextQ()" disabled>Siguiente →</button>
  </div>
</div>

<div class="card" id="results-card" style="display:none"></div>

<div class="tcp-footer">TCP Consulting · Coaching &amp; Liderazgo</div>

<script>
const questions = [
  ["Prudente y reflexivo","Leal y atento a los demás","Influyente y expresivo","Estratega y emprendedor"],
  ["Sociable y cercano","Honesto y discreto","Enérgico y orientado a resultados","Metódico y lógico"],
  ["Tranquilo y de humor estable","Decidido y al mando","Alegre y radiante","Formalista y objetivo"],
  ["Seguro de sí mismo y decidido","Ordenado y conciso","Familiar y estable","Comunicativo y de buen humor"],
  ["Perspicaz e imparcial","Exigente y directo","Constante y fiel a sus valores","Activo y sociable"],
  ["Complaciente y servicial","Esperanzador y expresivo","Poderoso y seguro de sí mismo","Reflexivo y dueño de sí mismo"],
  ["Abierto y persuasivo","Aplicado y selectivo en sus relaciones","Firme y emprendedor","Sereno y analítico"],
  ["Decidido y resuelto","Amable y jovial","Sensible y amigable","Lógico y correcto"],
  ["Compasivo y diplomático","Preciso y mesurado","Alentador y abierto a ideas","Orientado a resultados y rápido"],
  ["Responsable y firme","Reservado y cooperativo","Expansivo e imaginativo","Meticuloso y minucioso"],
  ["Espíritu de equipo y espontáneo","Controlado y racional","Amable y atento","Tenaz y orientado a resultados"],
  ["Analítico y escéptico","Amigable y entretenido","Exigente y sólido","Modesto y fiel"],
  ["Apegado a los suyos y tranquilo","Afectivo y confiado","Observador y distante","Activo y controlador"],
  ["Voluntarioso y tenaz","Conforme y sin prejuicios","Entusiasta y cautivador","Comprometido y consensuador"],
  ["Formal y con principios","Jovial y popular","Moderador y pacificador","Firme y resolutivo"],
  ["Animado y persuasivo","Decisor y dinámico","Analítico y disciplinado","Tolerante y tranquilo"],
  ["Paciente y empático","Lógico y moderado","Orientado a resultados y dispuesto al reto","Abierto a ideas y flexible"],
  ["Influyente y relajado","Discreto y filosófico","Reflexivo y circunspecto","Tenaz y determinado"],
  ["Orientado a procedimientos y bien preparado","Valiente y autónomo","Extrovertido y comunicativo","Benevolente y buen consejero"],
  ["Poderoso y claro","Espontáneo y vivaz","Estudioso y razonado","Tranquilo y amante de la armonía"],
  ["Organizado y prudente","Paciente y servicial","Argumentado y seguro de sí mismo","Interactivo y abierto"],
  ["Independiente y audaz","Flexible y armonioso","Objetivo y respetuoso de las normas","Amable y vivaz"],
  ["Expresivo y entusiasta","Directivo y realista","Compasivo y previsor","Atento y cuidadoso del detalle"],
  ["Estable y altruista","Objetivo y atrevido","Concienzudo e introspectivo","Sociable y bonvivant"],
  ["Detallista y precavido","Directo y claro","Expresivo y radiante","Tolerante y firme"]
];

const scoring = [
  [3,2,1,0],[2,0,1,3],[1,2,0,3],[0,3,2,1],[1,3,2,0],
  [2,1,0,3],[2,0,1,3],[0,1,2,3],[3,2,0,1],[0,2,1,3],
  [3,0,2,1],[2,1,3,0],[3,1,0,2],[0,2,3,1],[3,1,2,0],
  [1,0,3,2],[2,3,0,1],[3,0,2,1],[1,2,3,0],[0,1,3,2],
  [2,3,1,0],[0,3,1,2],[1,0,2,3],[1,3,0,2],[1,2,3,0]
];

const profiles = {
  Rojo: {
    emoji: "🔴",
    badge_bg: "#FAECE7", badge_color: "#993C1D",
    title: "Perfil Rojo — El Director",
    desc: "Estás orientado a resultados, eres decidido y te gusta tomar las riendas. Vas al grano, tomas decisiones rápidas y ejerces tu liderazgo con seguridad. Tu energía es un motor poderoso para el equipo.",
    forces: "Liderazgo afirmado · Toma de decisiones rápida · Orientación a resultados · Valentía directiva · Capacidad de movilizar",
    vigilance: "Tomarte tiempo para escuchar · Dar espacio a los demás · Dosificar la asertividad · Gestionar la impaciencia"
  },
  Amarillo: {
    emoji: "🟡",
    badge_bg: "#FAEEDA", badge_color: "#854F0B",
    title: "Perfil Amarillo — El Inspirador",
    desc: "Eres entusiasta, comunicativo y creativo. Federas a los equipos con tu optimismo y tu capacidad de generar nuevas ideas. Tu energía social es contagiosa y estimulante.",
    forces: "Creatividad · Entusiasmo · Comunicación · Federación de equipo · Visión inspiradora",
    vigilance: "Estructurar las ideas · Seguir los planes hasta el final · Gestionar las prioridades · Cumplir los plazos"
  },
  Verde: {
    emoji: "🟢",
    badge_bg: "#EAF3DE", badge_color: "#27500A",
    title: "Perfil Verde — El Apoyo",
    desc: "Eres estable, empático y valoras la armonía. Eres un pilar de confianza para tu equipo, siempre dispuesto a escuchar y apoyar. Favoreces naturalmente la cohesión y la cooperación.",
    forces: "Empatía · Escucha activa · Lealtad · Estabilidad · Espíritu de equipo",
    vigilance: "Afirmar tu punto de vista · Aceptar el cambio · Gestionar los conflictos · Saber decir no"
  },
  Azul: {
    emoji: "🔵",
    badge_bg: "#E6F1FB", badge_color: "#0C447C",
    title: "Perfil Azul — El Analista",
    desc: "Eres riguroso, metódico y orientado a la calidad. Analizas en profundidad antes de actuar y aportas precisión y fiabilidad. Eres el garante de los estándares y la excelencia en tu equipo.",
    forces: "Rigor · Análisis · Precisión · Sentido del detalle · Fiabilidad",
    vigilance: "Aceptar la imperfección · Decidir sin controlarlo todo · Comunicar con más espontaneidad · Delegar"
  }
};

const keys = ['Rojo','Amarillo','Verde','Azul'];
const cardClass = {Rojo:'rouge-card', Amarillo:'jaune-card', Verde:'vert-card', Azul:'bleu-card'};
const barColor = {Rojo:'#D85A30', Amarillo:'#BA7517', Verde:'#3B6D11', Azul:'#185FA5'};

let current = 0;
let answers = new Array(25).fill(null);

function render() {
  const opts = questions[current];
  const pct = Math.round(((current + 1) / 25) * 100);
  document.getElementById('q-counter').textContent = `Pregunta ${current + 1} / 25`;
  document.getElementById('q-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-text').textContent = `${current + 1}. Elige los dos adjetivos que mejor te describen:`;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  ['A','B','C','D'].forEach((ltr, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (answers[current] === i ? ' selected' : '');
    btn.innerHTML = `<span class="opt-letter">${ltr}</span><span class="opt-text">${opts[i]}</span>`;
    btn.onclick = () => { answers[current] = i; render(); };
    list.appendChild(btn);
  });

  document.getElementById('btn-prev').disabled = current === 0;
  const nxt = document.getElementById('btn-next');
  nxt.disabled = answers[current] === null;
  if (current === 24) {
    nxt.textContent = 'Ver mis resultados →';
    nxt.onclick = showResults;
  } else {
    nxt.textContent = 'Siguiente →';
    nxt.onclick = nextQ;
  }
}

function nextQ() { if (current < 24 && answers[current] !== null) { current++; render(); } }
function prevQ() { if (current > 0) { current--; render(); } }

function showResults() {
  const totals = {Rojo:0, Amarillo:0, Verde:0, Azul:0};
  answers.forEach((ans, i) => {
    if (ans === null) return;
    keys.forEach((k, ki) => { if (scoring[i][ki] === ans) totals[k]++; });
  });
  const dominant = keys.reduce((a,b) => totals[a] >= totals[b] ? a : b);
  const prof = profiles[dominant];
  const max = Math.max(...keys.map(k => totals[k])) || 1;

  document.getElementById('quiz-card').style.display = 'none';
  const res = document.getElementById('results-card');
  res.style.display = 'block';
  res.innerHTML = `
    <div class="results-header">
      <div class="result-badge" style="background:${prof.badge_bg};color:${prof.badge_color}">${prof.emoji} Perfil dominante</div>
      <div class="result-title">${prof.title}</div>
      <div class="result-sub">Resultados basados en tus ${answers.filter(a=>a!==null).length} respuestas</div>
    </div>
    <div class="scores-grid">
      ${keys.map(k => `<div class="score-card ${cardClass[k]}${k===dominant?' dominant':''}">
        <div class="score-num">${totals[k]}</div>
        <div class="score-lbl">${k}</div>
      </div>`).join('')}
    </div>
    <div class="bars-section">
      ${keys.map(k => `<div class="bar-row">
        <div class="bar-lbl" style="color:${barColor[k]}">${k}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((totals[k]/max)*100)}%;background:${barColor[k]}"></div></div>
        <div class="bar-val">${totals[k]}</div>
      </div>`).join('')}
    </div>
    <div class="info-box">
      <h3>Tu perfil</h3>
      <p>${prof.desc}</p>
    </div>
    <div class="info-box">
      <h3>Tus fortalezas clave</h3>
      <p>${prof.forces}</p>
    </div>
    <div class="info-box">
      <h3>Puntos de atención</h3>
      <p>${prof.vigilance}</p>
    </div>
    <button class="restart-btn" onclick="restart()">↺ Volver a empezar</button>
  `;
}

function restart() {
  current = 0;
  answers = new Array(25).fill(null);
  document.getElementById('results-card').style.display = 'none';
  document.getElementById('quiz-card').style.display = 'block';
  render();
}

render();
</script>
</body>
</html>
